<meta charset="utf-8">
<title>광주 개발 레이더 · 카드뉴스</title>
<style>
/*__FONTS__*/

:root{
  --bg:#0B0E13; --surface:#151A23; --line:#242C3A;
  --text:#FFFFFF; --muted:#8A95A6; --body:#C7CFDB;
  --accent:#FFE24B;
  --W:1080px; --H:1350px; --pad:76px;

  /* 분야별 색 */
  --c-교통:#5AA9FF; --c-재개발:#FF8A5A; --c-산단:#7DD87D;
  --c-주택:#C08CFF;  --c-공공:#4ED9C4;  --c-도시계획:#FFE24B;

  /* 진행 단계 색 — 여기서 신뢰가 갈린다 */
  --s-검토:#6B7686; --s-추진:#5AA9FF; --s-확정:#FFE24B;
  --s-착공:#7DD87D; --s-준공:#7DD87D;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#333;font-family:Pretendard,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#stage{display:flex;flex-direction:column;align-items:center;gap:24px;padding:24px}

.card{position:relative;width:var(--W);height:var(--H);background:var(--bg);color:var(--text);
  padding:var(--pad);display:flex;flex-direction:column;overflow:hidden}
.card .top{display:flex;justify-content:space-between;align-items:center;
  font-size:26px;font-weight:700;color:var(--muted);letter-spacing:-.02em}
.card .top .region{color:var(--accent)}
.card .foot{margin-top:auto;padding-top:32px;border-top:2px solid var(--line);
  display:flex;justify-content:space-between;align-items:center;
  font-size:26px;font-weight:600;color:var(--muted);letter-spacing:-.02em}
.card .foot .handle{color:var(--text);font-weight:800}
/* 기본은 상단 정렬 — 캐러셀을 넘길 때 제목 위치가 튀지 않게. 표지·마무리만 가운데. */
.body{flex:1;display:flex;flex-direction:column;padding:48px 0}
.body.cover,.cta .body{justify-content:center}
.wm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  transform:rotate(-24deg);font-size:150px;font-weight:800;color:rgba(255,226,75,.10);
  letter-spacing:.06em;pointer-events:none}

/* 배지 */
.tags{display:flex;gap:14px;align-items:center}
.tag{font-size:28px;font-weight:800;padding:12px 24px;border-radius:10px;letter-spacing:-.02em}
.tag.cat{background:var(--cat,#FFE24B);color:#0B0E13}
.tag.st{border:3px solid var(--st,#6B7686);color:var(--st,#6B7686)}
.tag.st.on{background:var(--st);color:#0B0E13;border-color:var(--st)}

/* 표지 */
.badge{display:inline-block;align-self:flex-start;background:var(--accent);color:#0B0E13;
  font-size:30px;font-weight:800;padding:14px 26px;border-radius:10px;letter-spacing:-.02em}
.cover h1{font-size:100px;font-weight:800;line-height:1.16;letter-spacing:-.045em;
  margin-top:40px;white-space:pre-line}
.cover .sub{margin-top:36px;font-size:34px;font-weight:500;color:var(--muted);letter-spacing:-.02em}
.cover .note{margin-top:14px;font-size:30px;font-weight:500;color:var(--muted);opacity:.75}

h2{font-size:60px;font-weight:800;letter-spacing:-.04em;line-height:1.25;white-space:pre-line}

/* 소식 1건 */
.news h3{margin-top:36px;font-size:70px;font-weight:800;line-height:1.24;
  letter-spacing:-.045em;white-space:pre-line}
.news .pts{margin-top:44px;display:flex;flex-direction:column;gap:24px}
.news .pt{display:flex;gap:20px;font-size:33px;font-weight:500;line-height:1.5;
  color:var(--body);letter-spacing:-.025em}
.news .pt::before{content:'';flex:none;width:14px;height:14px;margin-top:16px;
  border-radius:50%;background:var(--cat,#FFE24B)}
.meta{margin-top:auto;background:var(--surface);border-radius:20px;padding:34px 38px;
  display:flex;flex-direction:column;gap:16px}
.meta .r{display:flex;gap:22px;font-size:29px;letter-spacing:-.02em}
.meta .k{flex:none;width:130px;font-weight:700;color:var(--muted)}
.meta .v{font-weight:600;color:var(--text)}

/* 여러 건 한 장에 */
.list ul{margin-top:44px;list-style:none;display:flex;flex-direction:column;gap:28px}
.list li{display:flex;gap:24px;align-items:flex-start}
.list .chip{flex:none;font-size:24px;font-weight:800;padding:10px 18px;border-radius:8px;
  background:var(--cat,#FFE24B);color:#0B0E13;min-width:118px;text-align:center}
.list .hl{font-size:37px;font-weight:700;line-height:1.35;letter-spacing:-.035em}
.list .sb{margin-top:8px;font-size:26px;font-weight:500;color:var(--muted);letter-spacing:-.02em}

/* 일정 */
.timeline .tl{margin-top:48px;display:flex;flex-direction:column}
.timeline .it{display:flex;gap:32px}
.timeline .ln{flex:none;width:26px;display:flex;flex-direction:column;align-items:center}
.timeline .dot{width:26px;height:26px;border-radius:50%;background:var(--accent);margin-top:12px}
.timeline .it:not(:last-child) .bar{flex:1;width:4px;background:var(--line)}
.timeline .ct{padding-bottom:44px}
.timeline .wh{font-size:30px;font-weight:800;color:var(--accent);letter-spacing:-.02em}
.timeline .wt{margin-top:10px;font-size:40px;font-weight:700;line-height:1.32;letter-spacing:-.035em}
.timeline .nt{margin-top:8px;font-size:27px;font-weight:500;color:var(--muted);letter-spacing:-.02em}

/* 해설 */
.impact .items{margin-top:52px;display:flex;flex-direction:column;gap:44px}
.impact .hd{font-size:46px;font-weight:800;letter-spacing:-.035em;
  padding-left:26px;border-left:8px solid var(--accent)}
.impact .bd{margin-top:18px;padding-left:34px;font-size:33px;font-weight:500;
  line-height:1.55;color:var(--body);letter-spacing:-.025em}

/* 출처 */
.source ol{margin-top:44px;list-style:none;display:flex;flex-direction:column;gap:26px}
.source li{display:flex;gap:20px;font-size:30px;line-height:1.45;letter-spacing:-.025em}
.source .n{flex:none;font-weight:800;color:var(--accent)}
.source .t{font-weight:600}
.source .p{font-weight:500;color:var(--muted)}
.source .disc{margin-top:44px;padding:30px 34px;background:var(--surface);border-radius:18px;
  font-size:26px;font-weight:500;line-height:1.55;color:var(--muted);letter-spacing:-.02em}

/* 마무리 */
.cta .body{align-items:center;text-align:center}
.cta h2{font-size:76px;line-height:1.28}
.cta .bd{margin-top:40px;font-size:36px;font-weight:500;line-height:1.6;
  color:var(--body);letter-spacing:-.025em;white-space:pre-line}
.cta .pill{margin-top:64px;background:var(--accent);color:#0B0E13;font-size:44px;font-weight:800;
  padding:26px 52px;border-radius:999px;letter-spacing:-.02em}
</style>

<div id="stage"></div>

<script id="payload" type="application/json">/*__DATA__*/</script>
<script>
const D = JSON.parse(document.getElementById('payload').textContent);
const M = D.meta || {};
const esc = s => String(s ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const catVar = c => `--cat:var(--c-${esc(c)}, #FFE24B)`;
const stVar  = s => `--st:var(--s-${esc(s)}, #6B7686)`;
// 확정 이후 단계만 색을 채운다. "검토중"이 확정처럼 보이면 안 된다.
const stOn = s => ['확정', '착공', '준공'].includes(s) ? ' on' : '';

const tags = c => `<div class="tags">
    ${c.category ? `<span class="tag cat" style="${catVar(c.category)}">${esc(c.category)}</span>` : ''}
    ${c.status ? `<span class="tag st${stOn(c.status)}" style="${stVar(c.status)}">${esc(c.status)}</span>` : ''}
  </div>`;

const build = {
  cover: c => `<div class="body cover">
      <span class="badge">${esc(c.badge)}</span>
      <h1>${esc(c.title)}</h1>
      <div class="sub">${esc(c.subtitle)}</div>
      ${c.note ? `<div class="note">${esc(c.note)}</div>` : ''}
    </div>`,

  news: c => `<div class="body news" style="${catVar(c.category)}">
      ${tags(c)}
      <h3>${esc(c.headline)}</h3>
      <div class="pts">${(c.points || []).map(p => `<div class="pt"><span>${esc(p)}</span></div>`).join('')}</div>
      <div class="meta">
        ${c.area ? `<div class="r"><span class="k">영향 지역</span><span class="v">${esc(c.area)}</span></div>` : ''}
        <div class="r"><span class="k">출처</span><span class="v">${esc(c.source)}${c.date ? ` · ${esc(c.date)}` : ''}</span></div>
      </div>
    </div>`,

  list: c => `<div class="body list"><h2>${esc(c.title)}</h2><ul>
      ${c.items.map(i => `<li style="${catVar(i.category)}">
        <span class="chip">${esc(i.category)}</span>
        <span><div class="hl">${esc(i.headline)}</div>
          ${i.sub ? `<div class="sb">${esc(i.sub)}</div>` : ''}</span>
      </li>`).join('')}
    </ul></div>`,

  timeline: c => `<div class="body timeline"><h2>${esc(c.title)}</h2><div class="tl">
      ${c.items.map(i => `<div class="it">
        <span class="ln"><span class="dot"></span><span class="bar"></span></span>
        <span class="ct"><div class="wh">${esc(i.when)}</div><div class="wt">${esc(i.what)}</div>
          ${i.note ? `<div class="nt">${esc(i.note)}</div>` : ''}</span>
      </div>`).join('')}
    </div></div>`,

  impact: c => `<div class="body impact"><h2>${esc(c.title)}</h2><div class="items">
      ${c.items.map(i => `<div><div class="hd">${esc(i.head)}</div><div class="bd">${esc(i.body)}</div></div>`).join('')}
    </div></div>`,

  source: c => `<div class="body source"><h2>${esc(c.title || '출처')}</h2><ol>
      ${c.items.map((i, n) => `<li><span class="n">${n + 1}</span>
        <span><span class="t">${esc(i.title)}</span><br><span class="p">${esc(i.press)}${i.date ? ` · ${esc(i.date)}` : ''}</span></span></li>`).join('')}
    </ol>
    <div class="disc">${esc(c.disclaimer || M.disclaimer || '')}</div></div>`,

  cta: c => `<div class="body">
      <h2>${esc(c.title)}</h2><div class="bd">${esc(c.body)}</div>
      <div class="pill">${esc(c.handle || M.handle)}</div>
    </div>`,
};

const stage = document.getElementById('stage');
D.cards.forEach((c, i) => {
  const el = document.createElement('section');
  el.className = 'card ' + c.type;
  el.innerHTML =
    `<div class="top"><span class="region">${esc(M.region)}</span><span>${esc(M.period)}</span></div>` +
    (build[c.type] || (() => '<div class="body"></div>'))(c) +
    `<div class="foot"><span class="handle">${esc(M.handle)}</span><span>${i + 1} / ${D.cards.length}</span></div>` +
    (M.sample ? '<div class="wm">SAMPLE</div>' : '');
  stage.appendChild(el);
});
document.title = `${M.region} ${M.period} 카드뉴스`;
</script>
