<meta charset="utf-8">
<title>광주 부동산 월간 리포트 · 카드뉴스</title>
<style>
/*__FONTS__*/

:root{
  --bg:#0B0E13;          /* 카드 배경 (다크) */
  --surface:#151A23;     /* 박스 배경 */
  --line:#242C3A;        /* 구분선 */
  --text:#FFFFFF;
  --muted:#8A95A6;
  --accent:#FFE24B;      /* 네온 옐로 강조 */
  --up:#FF6B6B;          /* 상승 (한국식: 빨강) */
  --down:#5AA9FF;        /* 하락 (파랑) */
  --W:1080px;            /* 인스타 4:5 */
  --H:1350px;
  --pad:76px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#333;font-family:Pretendard,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#stage{display:flex;flex-direction:column;align-items:center;gap:24px;padding:24px}

.card{
  position:relative;width:var(--W);height:var(--H);
  background:var(--bg);color:var(--text);
  padding:var(--pad);display:flex;flex-direction:column;overflow:hidden;
}
/* 상단 러너 */
.card .top{display:flex;justify-content:space-between;align-items:center;
  font-size:26px;font-weight:700;color:var(--muted);letter-spacing:-.02em}
.card .top .region{color:var(--accent)}
/* 하단 브랜드 바 */
.card .foot{margin-top:auto;padding-top:32px;border-top:2px solid var(--line);
  display:flex;justify-content:space-between;align-items:center;
  font-size:26px;font-weight:600;color:var(--muted);letter-spacing:-.02em}
.card .foot .handle{color:var(--text);font-weight:800}
.body{flex:1;display:flex;flex-direction:column;justify-content:center;padding:56px 0}

/* 샘플 데이터 워터마크 — 실데이터 넣으면 meta.sample:false 로 끈다 */
.wm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  transform:rotate(-24deg);font-size:150px;font-weight:800;color:rgba(255,226,75,.10);
  letter-spacing:.06em;pointer-events:none}

/* ── 표지 ───────────────────────────── */
.badge{display:inline-block;align-self:flex-start;background:var(--accent);color:#0B0E13;
  font-size:30px;font-weight:800;padding:14px 26px;border-radius:10px;letter-spacing:-.02em}
.cover h1{font-size:104px;font-weight:800;line-height:1.16;letter-spacing:-.045em;margin-top:40px;white-space:pre-line}
.cover .sub{margin-top:36px;font-size:34px;font-weight:500;color:var(--muted);letter-spacing:-.02em}
.cover .note{margin-top:14px;font-size:30px;font-weight:500;color:var(--muted);opacity:.75}

/* ── 공통 제목 ───────────────────────── */
h2{font-size:60px;font-weight:800;letter-spacing:-.04em;line-height:1.25;white-space:pre-line}
h2 em{font-style:normal;background:var(--accent);color:#0B0E13;padding:2px 14px;border-radius:8px}

/* ── 숫자 3종 ───────────────────────── */
.stat .rows{margin-top:56px;display:flex;flex-direction:column;gap:26px}
.stat .row{background:var(--surface);border-radius:22px;padding:44px 46px;
  display:flex;align-items:baseline;justify-content:space-between}
.stat .lb{font-size:34px;font-weight:600;color:var(--muted);letter-spacing:-.02em}
.stat .rt{display:flex;align-items:baseline;gap:20px}
.stat .vl{font-size:82px;font-weight:800;letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.stat .un{font-size:36px;font-weight:700;color:var(--muted)}
.stat .dt{font-size:36px;font-weight:800;letter-spacing:-.02em}

/* ── 순위 ───────────────────────────── */
.rank ol{margin-top:48px;list-style:none;display:flex;flex-direction:column;gap:20px}
.rank li{display:flex;align-items:center;gap:28px;background:var(--surface);
  border-radius:20px;padding:32px 38px}
.rank .no{width:60px;height:60px;flex:none;border-radius:50%;background:var(--accent);color:#0B0E13;
  display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800}
.rank li:nth-child(n+4) .no{background:var(--line);color:var(--muted)}
.rank .nm{font-size:42px;font-weight:700;letter-spacing:-.03em}
.rank .sb{font-size:26px;font-weight:500;color:var(--muted);margin-top:6px}
.rank .rt{margin-left:auto;text-align:right}
.rank .vl{font-size:44px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.rank .dt{font-size:28px;font-weight:700;margin-top:6px}

/* ── 표 ─────────────────────────────── */
.table table{margin-top:48px;width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.table th{font-size:28px;font-weight:700;color:var(--muted);text-align:left;
  padding:0 0 22px;border-bottom:2px solid var(--line);letter-spacing:-.02em}
.table td{font-size:36px;font-weight:600;padding:30px 0;border-bottom:1px solid var(--line);letter-spacing:-.03em}
.table td:first-child{font-weight:700}
.table th:not(:first-child),.table td:not(:first-child){text-align:right}
.table .up{color:var(--up)}.table .down{color:var(--down)}

/* ── 인사이트 ───────────────────────── */
.insight .items{margin-top:52px;display:flex;flex-direction:column;gap:44px}
.insight .hd{font-size:46px;font-weight:800;letter-spacing:-.035em;
  padding-left:26px;border-left:8px solid var(--accent)}
.insight .bd{margin-top:18px;padding-left:34px;font-size:33px;font-weight:500;
  line-height:1.55;color:#C7CFDB;letter-spacing:-.025em}

/* ── 마무리 ─────────────────────────── */
.cta .body{align-items:center;text-align:center}
.cta h2{font-size:76px;line-height:1.28}
.cta .bd{margin-top:40px;font-size:36px;font-weight:500;line-height:1.6;color:#C7CFDB;letter-spacing:-.025em}
.cta .tag{margin-top:64px;background:var(--accent);color:#0B0E13;font-size:44px;font-weight:800;
  padding:26px 52px;border-radius:999px;letter-spacing:-.02em}

.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--muted)}
</style>

<div id="stage"></div>

<script id="payload" type="application/json">/*__DATA__*/</script>
<script>
const D = JSON.parse(document.getElementById('payload').textContent);
const M = D.meta || {};
const esc = s => String(s ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const dirCls = d => d === 'up' ? 'up' : d === 'down' ? 'down' : 'flat';

const build = {
  cover: c => `<div class="body cover">
      <span class="badge">${esc(c.badge)}</span>
      <h1>${esc(c.title)}</h1>
      <div class="sub">${esc(c.subtitle)}</div>
      ${c.note ? `<div class="note">${esc(c.note)}</div>` : ''}
    </div>`,

  stat: c => `<div class="body stat"><h2>${esc(c.title)}</h2><div class="rows">
      ${c.items.map(i => `<div class="row">
        <span class="lb">${esc(i.label)}</span>
        <span class="rt">
          <span class="vl">${esc(i.value)}</span>
          ${i.unit ? `<span class="un">${esc(i.unit)}</span>` : ''}
          ${i.delta ? `<span class="dt ${dirCls(i.dir)}">${esc(i.delta)}</span>` : ''}
        </span></div>`).join('')}
    </div></div>`,

  rank: c => `<div class="body rank"><h2>${esc(c.title)}</h2><ol>
      ${c.items.map((i, n) => `<li>
        <span class="no">${n + 1}</span>
        <span><div class="nm">${esc(i.name)}</div>${i.sub ? `<div class="sb">${esc(i.sub)}</div>` : ''}</span>
        <span class="rt"><div class="vl">${esc(i.value)}</div>
          ${i.delta ? `<div class="dt ${dirCls(i.dir)}">${esc(i.delta)}</div>` : ''}</span>
      </li>`).join('')}
    </ol></div>`,

  table: c => `<div class="body table"><h2>${esc(c.title)}</h2><table>
      <thead><tr>${c.columns.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead>
      <tbody>${c.rows.map(r => `<tr>${r.map(v => {
        const s = String(v), k = s.startsWith('+') ? ' class="up"' : s.startsWith('-') ? ' class="down"' : '';
        return `<td${k}>${esc(v)}</td>`;
      }).join('')}</tr>`).join('')}</tbody>
    </table></div>`,

  insight: c => `<div class="body insight"><h2>${esc(c.title)}</h2><div class="items">
      ${c.items.map(i => `<div><div class="hd">${esc(i.head)}</div><div class="bd">${esc(i.body)}</div></div>`).join('')}
    </div></div>`,

  cta: c => `<div class="body">
      <h2>${esc(c.title)}</h2>
      <div class="bd">${esc(c.body)}</div>
      <div class="tag">${esc(c.handle || M.handle)}</div>
    </div>`,
};

const stage = document.getElementById('stage');
D.cards.forEach((c, i) => {
  const el = document.createElement('section');
  el.className = 'card ' + c.type;
  el.dataset.n = String(i + 1).padStart(2, '0');
  el.innerHTML =
    `<div class="top"><span class="region">${esc(M.region)}</span><span>${esc(M.period)}</span></div>` +
    (build[c.type] || (() => '<div class="body"></div>'))(c) +
    `<div class="foot"><span class="handle">${esc(M.handle)}</span><span>${i + 1} / ${D.cards.length}</span></div>` +
    (M.sample ? '<div class="wm">SAMPLE</div>' : '');
  stage.appendChild(el);
});
document.title = `${M.region} ${M.period} 카드뉴스`;
</script>
